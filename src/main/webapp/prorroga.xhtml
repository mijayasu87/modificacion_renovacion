<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <f:metadata>
        <f:event type="preRenderView" listener="#{prorrogaBean.alertaVencidas}"/>
    </f:metadata>
    <h:head>
        <title>PRÓRROGAS-RENOVACIONES</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
        <h:outputStylesheet library="css" name="style.css"/>
        <h:outputScript library="js" name="app.js"/>
        <link rel="shortcut icon" type="image/png" href="#{resource['images/favicon.png']}"/>
    </h:head>
    <h:body>
        <!-- Start Page Loading -->
        <div id="loader-wrapper">
            <div id="loader"></div>
            <div class="loader-section section-left"></div>
            <div class="loader-section section-right"></div>
        </div>

        <div class="menu">
            <a href="renovaciones.xhtml" class="logo" title="Logo Senadi" ><img src="resources/images/senadilogo.png" width="165px"/></a>

            <i id="edit_action" class="material-icons prefix user" style="position: absolute; padding: 0 7px; line-height: 42px; display: inline-block;">person</i>
            <p:outputLabel value="#{loginBean.login}" style="margin-left: 35px; line-height: 42px; display: inline-block; padding: 0 7px; position: absolute" class="user"/>

            <div class="header-right">
                <p:commandLink styleClass="btn_logout"
                               actionListener="#{loginBean.logout}"
                               oncomplete="logout(xhr, status, args)"
                               title="CERRAR SESIÓN" immediate="true">
                    <i class="material-icons">exit_to_app</i>
                </p:commandLink>
            </div>
            <a class="itemm" href="settings.xhtml" title="Configuración" style="display:  #{loginBean.usuarioConsulta eq true?'none':'inline-block'}"><i class="material-icons" >settings</i></a>
            <a class="activo" href="#" title="Prórrogas" >PRÓRROGAS</a>
            <a class="itemm" href="abandono.xhtml" title="Abandono" >ABANDONO</a>            
            <a class="itemm" href="caducadas.xhtml" title="Caducadas" >CADUCADAS-NEGADAS</a>
            <a class="itemm" href="desistidas.xhtml" title="Desistidas" >DESISTIDAS</a>            
            <a class="itemm" href="notificadas.xhtml" title="Notificadas" >NOTIFICADAS</a>            
            <a class="itemm" href="renovaciones.xhtml" title="Renovaciones" >RENOVACIONES</a>
        </div>
        <p:growl id="mensajes" showDetail="true" life="3000"/>
        <h:form id="allform" style=" background: #e3e3e3; min-height: calc(100vh - 424px);">
            <h:panelGrid columns="1"  style="text-align: center; font-size: 16px; font-weight: bold; margin: 0 auto; width: 97%;">
                <p:panel class="panelContent" >
                    <p:tabView style="font-size: 12px; margin: 0 auto; width: 50%">
                        <p:tab title="Búsqueda por Criterio" >
                            <p:outputLabel value="BUSCAR: " style="font-size: 13px; font-weight: bold; margin-right: 5px;"/>
                            <p:inputText id="buscarText" value="#{prorrogaBean.criterio}"
                                         style="font-size: 14px; margin-right: 5px; width: 40%" placeholder="Ingrese un criterio de búsqueda"
                                         title="Puede buscar por No. Solicitud, Denominación o Titular Actual"/>
                            <p:commandButton value="BUSCAR" actionListener="#{prorrogaBean.buscarProrroga}"
                                             update="allform:tablaDeProrrogas mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" process="@parent" class="btn_peque"/>
                        </p:tab>
                        <p:tab title="Búsqueda por Fecha" >
                            <p:outputLabel value="DESDE:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{prorrogaBean.fechaInicio}" label="Fecha Desde" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Inicio de Búsqueda" navigator="true"/>
                            <p:outputLabel value="HASTA:" style="font-size: 13px; margin-right: 5px;"/>
                            <p:calendar pattern="yyyy-MM-dd" value="#{prorrogaBean.fechaFin}" label="Fecha Hasta" style="font-size: 13px; margin-right: 5px;"
                                        placeholder="Fecha Fin de Búsqueda" navigator="true"/>
                            <p:commandButton value="BUSCAR"
                                             actionListener="#{prorrogaBean.buscarProrrogasPorFecha}"
                                             update="allform:tablaDeProrrogas mensajes allform:num_registros allform:num_reg"
                                             style="font-size: 13px" class="btn_peque"
                                             process="@parent" title="Se busca por fecha de Presentación o Prórroga"/>
                        </p:tab>
                    </p:tabView>

                    <div style="float: right; font-weight: bold; margin-top: -20px; margin-left: 5px; border: solid #ff9800; background: #fff3e0; padding: 3px" >EN PLAZO</div>
                    <div style="float: right; font-weight: bold; margin-top: -20px; margin-left: 5px; border: solid #e53935; background: #ffebee; padding: 3px" >PLAZO VENCIDO</div>
                    <br/>
                    <p:outputLabel value="#{prorrogaBean.numeroVencidas} TRÁMITE(S) CON EL PLAZO DE PRÓRROGA VENCIDO"
                                   rendered="#{prorrogaBean.numeroVencidas gt 0}"
                                   style="float: right; font-size: 12px; font-weight: bold; color: #c62828; margin-top: 8px"/>

                    <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />
                    <p:dialog widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                        <p:graphicImage name="/images/ajax-loader.gif" />
                    </p:dialog>
                    <p:outputLabel id="num_reg" value="#{prorrogaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <br/><br/>
                    <p:dataTable id="tablaDeProrrogas" var="prorroga"
                                 value="#{prorrogaBean.prorrogas}" widgetVar="tablaDeProrrogas"
                                 emptyMessage="No hay Datos para mostrar"
                                 filteredValue="#{prorrogaBean.prorrogasFiltradas}"
                                 binding="#{prorrogaBean.prorrogasDataTable}"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 selection="#{prorrogaBean.selectedProrrogas}"
                                 style="font-size: 9px !important;"
                                 rowStyleClass="#{prorrogaBean.getEstiloFila(prorroga)}"
                                 rowKey="#{prorroga.id}">

                        <f:facet name="header">
                            <p:outputPanel>
                                <h:outputText value="BUSCAR EN RESULTADO: " />
                                <p:inputText id="globalFilter" onkeyup="PF('tablaDeProrrogas').filter()"
                                             style="width:300px" placeholder="Escriba aquí"/>
                            </p:outputPanel>
                        </f:facet>

                        <p:column selectionMode="multiple" style="width:20px;text-align:center" rendered="#{!loginBean.usuarioConsulta}" exportable="false"/>

                        <p:column headerText="Solicitud" style="text-align: center;" filterBy="#{prorroga.solicitud}" >
                            <h:outputText value="#{prorroga.solicitud}" />
                        </p:column>
                        <p:column headerText="F. Presentación" style="text-align: center;" filterBy="#{prorroga.fechaPresentacion}" >
                            <h:outputText value="#{prorroga.fechaPresentacion}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="N. Prórroga" style="text-align: center;" filterBy="#{prorroga.numeroProrroga}" >
                            <p:commandLink value="#{prorroga.numeroProrroga}" style="color: #0089ec; font-size: 14px; font-weight: bold" process="@this"
                                           title="Visualizar Prórroga Notificada" actionListener="#{prorrogaBean.validarProrroga(prorroga)}"
                                           oncomplete="if(args.viewpro){otherpage(args.view)};" update="mensajes"
                                           rendered="#{prorroga.prorrogaNotificada}"/>
                            <h:outputText value="#{prorroga.numeroProrroga}" rendered="#{!prorroga.prorrogaNotificada}"/>
                        </p:column>
                        <p:column headerText="F. Prórroga" style="text-align: center;" filterBy="#{prorroga.fechaProrroga}" >
                            <h:outputText value="#{prorroga.fechaProrroga}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="F. Inicio Plazo" style="text-align: center;" filterBy="#{prorroga.fechaPuestaProrroga}" >
                            <h:outputText value="#{prorroga.fechaPuestaProrroga}" title="#{prorrogaBean.getTooltipProrroga(prorroga)}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Días" style="text-align: center;" filterBy="#{prorroga.diasProrroga}" >
                            <h:outputText value="#{prorrogaBean.getDiasTexto(prorroga)}" title="#{prorrogaBean.getTooltipProrroga(prorroga)}"/>
                        </p:column>
                        <p:column headerText="Plazo" style="text-align: center; width: 110px" >
                            <h:outputText value="#{prorrogaBean.getEstadoPlazo(prorroga)}" title="#{prorrogaBean.getTooltipProrroga(prorroga)}"
                                          styleClass="#{prorrogaBean.getClasePlazo(prorroga)}"/>
                        </p:column>
                        <p:column headerText="Escrito No." style="text-align: center;" filterBy="#{prorroga.numeroAlcance}" >
                            <h:outputText value="#{prorroga.numeroAlcance}" />
                        </p:column>
                        <p:column headerText="F. Escrito" style="text-align: center;" >
                            <h:outputText value="#{prorroga.fechaAlcance}" >
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Notificación" style="text-align: center;" filterBy="#{prorroga.notificacion}" >
                            <h:outputText value="#{prorroga.notificacion}" />
                        </p:column>
                        <p:column headerText="Registro" style="text-align: center;" filterBy="#{prorroga.registroNo}" >
                            <h:outputText value="#{prorroga.registroNo}" />
                        </p:column>
                        <p:column headerText="Denominación" style="text-align: center;" filterBy="#{prorroga.denominacion}" >
                            <h:outputText value="#{prorroga.denominacion}" />
                        </p:column>
                        <p:column headerText="Signo" style="text-align: center;" filterBy="#{prorroga.signo}" >
                            <h:outputText value="#{prorroga.signo}" />
                        </p:column>
                        <p:column headerText="Titular Actual" style="text-align: center;" filterBy="#{prorroga.titularActual}" >
                            <h:outputText value="#{prorroga.titularActual}" />
                        </p:column>
                        <p:column headerText="Responsable" style="text-align: center;">
                            <h:outputText value="#{prorroga.responsable}" />
                        </p:column>
                        <p:column id="editar" headerText="Acción"  exportable="false" style="margin: 0 auto; width: 115px;"
                                  styleClass="#{prorroga.prorrogaNotificada eq true ?'border_green_color':null}">
                            <p:commandLink class="link"
                                           actionListener="#{prorrogaBean.prepararEditar}"
                                           update="allform:dlgNuevaT allform:frmNuevaT:datosNuevaT allform:frmNuevaT:guardarBtn "
                                           oncomplete="if(args.peditar){PF('dlgNuevaT').show()};"
                                           process="@this"
                                           title="Editar" rendered="#{!loginBean.usuarioConsulta}">
                                <i id="edit_action" class="material-icons md-18">edit</i>
                            </p:commandLink>
                            <p:commandLink class="link"
                                           actionListener="#{prorrogaBean.prepararHistorial}"
                                           title="Seguimiento" process="@this"
                                           update="allform:dlgHistorial"
                                           oncomplete="PF('dlgHistorial').show();" rendered="#{!loginBean.usuarioConsulta}">
                                <i id="history_action" class="material-icons md-18">history</i>
                            </p:commandLink>
                            <p:commandLink class="link" title="Descargar"
                                           actionListener="#{prorrogaBean.prepararDescarga}"
                                           process="@this" update="mensajes allform:tablaDeProrrogas"
                                           oncomplete="if(args.doit){popupwindow('prorrogareport', '_blank', args);}"
                                           rendered="#{!loginBean.usuarioConsulta}">
                                <i id="download_action" class="material-icons md-18">picture_as_pdf</i>
                            </p:commandLink>
                            <p:commandLink class="link_remove"
                                           actionListener="#{prorrogaBean.eliminarProrroga}"
                                           update="allform:tablaDeProrrogas mensajes allform:num_registros allform:num_reg"
                                           title="Eliminar Prórroga" process="@this" rendered="#{!loginBean.usuarioConsulta}">
                                <i id="delete_action" class="material-icons md-18">delete</i>
                                <p:confirm header="CONFIRMAR" message="SEGURO DE ELIMINAR LA PRÓRROGA CON SOLICITUD #{prorroga.solicitud} ?"/>
                            </p:commandLink>
                        </p:column>
                        <f:facet name="footer">
                            <p:commandButton process="tablaDeProrrogas" value="Descargar Seleccionados"
                                             actionListener="#{prorrogaBean.downloadSelected}"
                                             update="mensajes" oncomplete="if(args.doit){popupwindow('prorrogareport', '_blank', args);}"
                                             rendered="#{!loginBean.usuarioConsulta}" class="btn_peque" />
                        </f:facet>
                    </p:dataTable>
                    <p:outputLabel id="num_registros" value="#{prorrogaBean.numRegistros}" style="float: left; font-size: 12px"/>
                    <h:panelGrid columns="2" style="float: right;">
                        <h:commandLink id="excelExport" title="Exportar a excel..." rendered="#{!loginBean.usuarioConsulta}" immediate="true"
                                       onclick="return downloadExcelXHR(this.id, '#{prorrogaBean.exportName}');">
                            <p:graphicImage class="excel" width="20px" height="20px" library="images" name="excel.png"/>
                            <p:dataExporter type="xls" target="tablaDeProrrogas" fileName="#{prorrogaBean.exportName}"/>
                        </h:commandLink>
                        <br/>
                    </h:panelGrid>
                    <br/>
                </p:panel>
            </h:panelGrid>

            <p:dialog id="dlgNuevaT" modal="true" resizable="true"
                      header="#{prorrogaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgNuevaT" style="font-size: 11px; margin-bottom: 10px" showEffect="clip"
                      hideEffect="explode" closeOnEscape="true" width="80%" styleClass="dlg-nuevo-n">
                <p:ajax event="close" update="dlgNuevaT" resetValues="true" />
                <p:growl id="nuevoreg" life="1000"/>
                <h:form id="frmNuevaT" >
                    <p:panelGrid columns="6" id="datosNuevaT" styleClass="showcase-text-align-center noBorders" style="width: 100%"
                                 columnClasses="ten-percent,twenty-percent,ten-percent,twenty-percent,ten-percent,twenty-percent">

                        <p:outputLabel value="Solicitud:" for="solicitudForm" style="float: right"/>
                        <p:inputText id="solicitudForm" value="#{prorrogaBean.prorroga.solicitud}" title="Solicitud" required="true"
                                     readonly="true" styleClass="input-key maxsize"/>

                        <p:outputLabel value="N. Prórroga:" for="noProrrogaForm" style="float: right"/>
                        <p:inputText id="noProrrogaForm" value="#{prorrogaBean.prorroga.numeroProrroga}" title="N. Prórroga"
                                     readonly="true" styleClass="maxsize"/>

                        <p:outputLabel value="F. Prórroga:" for="fProrrogaForm" style="float: right"/>
                        <p:calendar id="fProrrogaForm" value="#{prorrogaBean.prorroga.fechaProrroga}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha Prórroga" inputStyleClass="maxsize" navigator="true"/>

                        <p:outputLabel value="Escrito No. (Alcance):" for="numeroAlcanceForm" style="float: right"/>
                        <p:inputText id="numeroAlcanceForm" value="#{prorrogaBean.prorroga.numeroAlcance}" title="Escrito No." class="maxsize"/>

                        <p:outputLabel value="Fecha Escrito:" for="fechaAlcanceForm" style="float: right"/>
                        <p:calendar id="fechaAlcanceForm" value="#{prorrogaBean.prorroga.fechaAlcance}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha Escrito" inputStyleClass="maxsize" navigator="true"/>

                        <p:outputLabel value="Notificación:" for="notificacionForm" style="float: right"/>
                        <p:inputText id="notificacionForm" value="#{prorrogaBean.prorroga.notificacion}" title="Notificación" class="maxsize"/>

                        <p:outputLabel value="Registro:" for="registroForm" style="float: right"/>
                        <p:inputText id="registroForm" value="#{prorrogaBean.prorroga.registroNo}" title="Registro" class="maxsize"/>

                        <p:outputLabel value="F. Registro:" for="fregistroForm" style="float: right"/>
                        <p:calendar id="fregistroForm" value="#{prorrogaBean.prorroga.fechaRegistro}" timeZone="GMT-5"
                                    mask="true" pattern="yyyy-MM-dd" title="Fecha de Registro" inputStyleClass="maxsize" navigator="true"/>

                        <p:outputLabel value="Solicitante:" for="solicitanteForm" style="float: right"/>
                        <p:inputTextarea id="solicitanteForm" value="#{prorrogaBean.prorroga.solicitante}" title="Solicitante" class="maxsize"
                                         autoResize="false" rows="2"/>

                        <p:outputLabel value="Denominación:" for="denominacionForm" style="float: right"/>
                        <p:inputTextarea id="denominacionForm" value="#{prorrogaBean.prorroga.denominacion}" title="Denominación"
                                         class="maxsize" autoResize="false" rows="2"/>

                        <p:outputLabel value="Signo:" for="signoForm" style="float: right"/>
                        <p:inputText id="signoForm" value="#{prorrogaBean.prorroga.signo}" title="Signo" class="maxsize"/>

                        <p:outputLabel value="Titular Actual:" for="tactualForm" style="float: right"/>
                        <p:inputTextarea id="tactualForm" value="#{prorrogaBean.prorroga.titularActual}" title="Titular Actual"
                                         class="maxsize" autoResize="false" rows="2"/>

                        <p:outputLabel value="Casillero SENADI:" for="casSenadiForm" style="float: right"/>
                        <p:panel class="noBorders" style="padding: 0 0 !important; border: none !important">
                            <p:inputText id="casSenadiForm" value="#{prorrogaBean.prorroga.casilleroSenadi}" title="Casillero SENADI" style="width: 80%"/>
                            <p:commandButton icon="pi pi-search" class="btn_peque" actionListener="#{prorrogaBean.buscarCasillero}"
                                             process="@parent" update="casSenadiForm" style="width: 12%" title="BUSCAR CASILLERO"/>
                        </p:panel>

                        <p:outputLabel value="Responsable:" for="responsableForm" style="float: right"/>
                        <p:inputText id="responsableForm" value="#{prorrogaBean.prorroga.responsable}" title="Responsable" class="maxsize"/>

                        <p:outputLabel value="Url:" style="float: right !important"/>
                        <p:commandLink value="Ruta Expediente" actionListener="#{prorrogaBean.prepararExpediente}" process="@this"
                                       disabled="#{prorrogaBean.prorroga.solicitud eq null? true:false}" styleClass="url-link"
                                       oncomplete="PF('dlgExpediente').show();" update="allform:dlgExpediente mensajes">
                            <i class="material-icons md-18" style="vertical-align: middle; margin-right: 4px;">folder_open</i>
                        </p:commandLink>
                    </p:panelGrid>
                    <p:outputLabel value="RO:" for="roForm" style="float: left"/>
                    <p:inputTextarea id="roForm" value="#{prorrogaBean.prorroga.ro}" class="maxsize" autoResize="false" rows="2"/>

                    <p:panelGrid id="guardarBtn" columns="4" styleClass="ui-noborder dlg-actions" style="width: 100%; text-align: right">
                        <p:outputLabel value="PASAR A:" style="font-weight: bold"/>
                        <p:selectOneMenu id="estadoRegistro" style="margin-right: 20px"
                                         value="#{prorrogaBean.estadoTemp}">
                            <f:selectItem itemLabel="Seleccionar..." itemValue="" noSelectionOption="true"/>
                            <f:selectItem itemLabel="CERTIFICADOS (RENOVACIONES)" itemValue="RENOVACIONES"/>
                            <f:selectItem itemLabel="NOTIFICADAS" itemValue="NOTIFICADAS"/>
                            <f:selectItem itemLabel="ABANDONO" itemValue="ABANDONO"/>
                            <p:ajax event="itemSelect" update="mensajes frmNuevaT:guardarBtn" listener="#{prorrogaBean.onEstadoSelectedListener}" />
                        </p:selectOneMenu>

                        <p:commandButton value="#{prorrogaBean.saveEdit}" actionListener="#{prorrogaBean.guardarProrroga}"
                                         update="mensajes allform:tablaDeProrrogas datosNuevaT"
                                         oncomplete="if(args.saved){PF('dlgNuevaT').hide();}"
                                         process="@form" class="btn_peque" icon="pi pi-check">
                            <p:confirm header="Seguridad" message="#{prorrogaBean.mensajeConfirmacion}" />
                        </p:commandButton>
                        <p:commandButton value="CERRAR" oncomplete="PF('dlgNuevaT').hide();" process="@form" class="btn_cerrar" icon="pi pi-times"/>
                    </p:panelGrid>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgExpediente" modal="true" resizable="true"
                      header="#{prorrogaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgExpediente" style="font-size: 11px;" showEffect="explode"
                      hideEffect="explode" closeOnEscape="true" width="50%">
                <p:ajax event="close" update="dlgExpediente" resetValues="true" />
                <h:form id="frmExpediente" >
                    <p:dataTable id="tablaDeArchivos" var="archivo"
                                 value="#{prorrogaBean.archivos}" widgetVar="tablaDeArchivos"
                                 emptyMessage="No hay Datos para mostrar"
                                 paginator="true"
                                 paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rows="20"
                                 rowsPerPageTemplate="20,50,100,150,200,250,300"
                                 style="border: black !important" >
                        <p:column headerText="Archivos" style="text-align: center;" filterBy="#{archivo}" >
                            <p:commandLink value="#{archivo.nombre}" style="color: #0089ec; font-size: 14px;"
                                           onclick="otherpage('https://registro.propiedadintelectual.gob.ec/solicitudes/media/files/renewal_forms/#{prorrogaBean.prorroga.idRenewalForm}/#{archivo.documento}')" />
                        </p:column>
                    </p:dataTable>
                </h:form>
            </p:dialog>

            <p:dialog id="dlgHistorial" modal="true" resizable="true"
                      header="#{prorrogaBean.dialogTitle}" fitViewport="true"
                      widgetVar="dlgHistorial" style="font-size: 11px; width: 200px" showEffect="explode"
                      hideEffect="explode" closeOnEscape="true">
                <p:ajax event="close" update="dlgHistorial" resetValues="true" />
                <h:form id="frmHistory" >
                    <p:inputTextarea id='historialText' value="#{prorrogaBean.historial}" rows="10" cols="115" readonly="true"/>
                </h:form>
            </p:dialog>

            <p:confirmDialog global="true" showEffect="explode" hideEffect="explode">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes btn_peque"/>
                <p:commandButton value="No" type="button"  styleClass="ui-confirmdialog-no btn_peque"/>
            </p:confirmDialog>

            <br/>
        </h:form>

        <div id="footer"></div>
    </h:body>
    <script type="text/javascript">
        $(document).ready(function () {
            setTimeout(function () {
                $('body').addClass('loaded');
                $('h1').css('color', '#222222');
                $("#footer").load("footer.html");
            }, 150);
        });

        //<![CDATA[
        function popupwindow(url, title, args) {
            if (args.doit) {
                window.open(url, title);
            }
        }
        function otherpage(url) {
            setTimeout(function () {
                window.open(url, '_blank');
            }, 0);
        }
        function logout(xhr, status, args) {
            setTimeout(function () {
                window.location = 'login.xhtml';
            }, 500);
        }
        //]]>
    </script>
</html>
